        const DEFAULT_LAST_TRANSIT_MINUTES = 60;

        function addItemToActiveDay(newItem) {
            const activeDay = itineraryData[activeDayIndex];
            if (!activeDay) return;
            const overnightIndex = activeDay.items.findIndex(item => item.duration === 'OVERNIGHT');
            const insertAt = overnightIndex >= 0 ? overnightIndex : activeDay.items.length;
            // A trailing item may still hold the gap to an activity that was
            // deleted. A newly appended activity starts after a fresh hour.
            if (insertAt > 0) activeDay.items[insertAt - 1].transitAfter = DEFAULT_LAST_TRANSIT_MINUTES;
            activeDay.items.splice(insertAt, 0, newItem);
            if (insertAt === activeDay.items.length - 1) {
                newItem.transitAfter = DEFAULT_LAST_TRANSIT_MINUTES;
            }

            recalculateTimes();
        }

        function addSpotToCurrentDay(spotId) {
            const spot = ATTRACTIONS_DATA.find(s => s.id === spotId);
            if (!spot) return;

            const newItem = {
                id: spot.id + '_' + Date.now(),
                name: spot.name,
                duration: spot.duration,
                transitAfter: 30,
                transitNotes: '',
                notes: spot.desc,
                category: spot.category,
                startTime: '',
                endTime: ''
            };

            addItemToActiveDay(newItem);
        }

        function addCommonPlan(kind) {
            const plan = COMMON_PLANS[kind];
            if (!plan) return;
            const newItem = {
                id: `common_${kind}_${Date.now()}`,
                name: plan.name,
                duration: plan.duration,
                transitAfter: 30,
                transitNotes: '',
                notes: '',
                category: plan.category,
                startTime: '',
                endTime: ''
            };
            if (!plan.preferredStartTime) {
                addItemToActiveDay(newItem);
                return;
            }

            const day = itineraryData[activeDayIndex];
            if (!day) return;
            const target = timeToMinutes(plan.preferredStartTime);
            // Insert just before the first activity that extends past the meal
            // time, so the meal starts near its target without overlapping the
            // preceding activity. An overnight stay always stays last.
            const insertAt = day.items.findIndex(item =>
                item.endTime === '翌朝' || timeToMinutes(item.endTime) > target
            );
            const index = insertAt < 0 ? day.items.length : insertAt;
            const previous = day.items[index - 1];
            const following = day.items[index];
            // Place the meal from its preferred clock time first. The old
            // transfer belonged to the previous pair and must not decide the
            // meal's start; derive both neighboring transfers afterwards.
            const earliestStart = previous ? timeToMinutes(previous.endTime) : target;
            const mealStart = Math.max(target, earliestStart);
            if (previous) {
                previous.transitAfter = mealStart - timeToMinutes(previous.endTime);
            } else {
                day.startTime = minutesToTime(mealStart);
            }
            // Keep the next activity at its existing time when the gap allows
            // it; otherwise leave a 30-minute transfer after the meal.
            if (following && following.startTime !== '翌朝') {
                newItem.transitAfter = Math.max(30,
                    timeToMinutes(following.startTime) - mealStart - plan.duration);
            } else if (!following) {
                newItem.transitAfter = DEFAULT_LAST_TRANSIT_MINUTES;
            }
            day.items.splice(index, 0, newItem);
            recalculateTimes();
        }

        function handleCustomSpotSubmit(e) {

                name: nameInput.value.trim(),

                transitAfter: 30,
                transitNotes: '',
                notes: '',

            };

        }

        function updateItemName(index, val) {
            if (isItemLocked(index)) return;
            itineraryData[activeDayIndex].items[index].name = val.trim();
            autoSaveToLocalStorage();
        }

        function updateItemCategory(index, val) {
            if (isItemLocked(index)) return;
            itineraryData[activeDayIndex].items[index].category = val;
            renderTimeline();
            autoSaveToLocalStorage();
        }

        function updateItemDuration(index, val) {
            if (isItemLocked(index)) return;
            if (val === 'OVERNIGHT') {
                itineraryData[activeDayIndex].items[index].duration = 'OVERNIGHT';
                recalculateTimes();
            } else {
                const parsed = parseInt(val, 10);
                if (isNaN(parsed) || parsed < 1) return;
                if (itineraryData[activeDayIndex].items[index].duration !== 'OVERNIGHT') {
                    resizeTimelineItem(index, parsed);
                } else {
                    itineraryData[activeDayIndex].items[index].duration = parsed;
                    recalculateTimes();
                }
            }
        }

        function isValidClockTime(value) {
            return /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
        }

        function rejectTimeEdit(input, previousValue, message) {
            input.value = previousValue;
            window.alert(message);
        }

        function updateTimelineClock(index, part, selected) {
            const picker = selected.parentElement;
            const hours = picker.querySelector('.clock-hour');
            const minutes = picker.querySelector('.clock-minute');
            const selection = {
                get value() { return `${hours.value}:${minutes.value}`; },
                set value(time) {
                    const [hour, minute] = time.split(':');
                    hours.value = hour;
                    minutes.innerHTML = renderMinuteOptions(minute);
                }
            };
            if (part === 'start') updateItemStartTime(index, selection);
            else updateItemEndTime(index, selection);
        }

        function updateItemStartTime(index, input) {
            const day = itineraryData[activeDayIndex];
            const item = day.items[index];
            if (item.locked) return;
            const newTime = input.value;
            if (!isValidClockTime(newTime)) {
                rejectTimeEdit(input, item.startTime, '開始時刻を時:分の形式で入力してください。');
                return;
            }

            if (index === 0) {
                day.startTime = newTime;
                recalculateTimes();
                renderDayTabs();
                return;
            }

            const previous = day.items[index - 1];
            if (previous.endTime === '翌朝' || timeToMinutes(newTime) < timeToMinutes(previous.endTime)) {
                rejectTimeEdit(input, item.startTime,
                    `前の予定の終了時刻（${previous.endTime}）より早い開始時刻にはできません。`);
                return;
            }

            previous.transitAfter = timeToMinutes(newTime) - timeToMinutes(previous.endTime);
            recalculateTimes();
        }

        function updateItemEndTime(index, input) {
            const item = itineraryData[activeDayIndex].items[index];
            if (item.locked) return;
            const newTime = input.value;
            if (!isValidClockTime(newTime) || timeToMinutes(newTime) <= timeToMinutes(item.startTime)) {
                rejectTimeEdit(input, item.endTime, '終了時刻は開始時刻より後にしてください。');
                return;
            }

            item.duration = timeToMinutes(newTime) - timeToMinutes(item.startTime);
            recalculateTimes();
        }

        function updateTransitTime(index, val) {
            if (isItemLocked(index)) return;
            const parsed = parseInt(val, 10);
            if (isNaN(parsed) || parsed < 0) return;
            itineraryData[activeDayIndex].items[index].transitAfter = parsed;
            recalculateTimes();
        }

        function updateTransitNotes(index, val) {
            if (isItemLocked(index)) return;
            itineraryData[activeDayIndex].items[index].transitNotes = val;
            autoSaveToLocalStorage();
        }

        function updateItemNotes(index, text) {
            if (isItemLocked(index)) return;
            itineraryData[activeDayIndex].items[index].notes = text;
            autoSaveToLocalStorage();
        }

        function removeTimelineItem(index) {
            if (isItemLocked(index)) return;
            closeEventEditor();
            const day = itineraryData[activeDayIndex];
            const items = day.items;
            const intervals = getTimelineIntervals(day);
            const previous = intervals[index - 1];
            const following = intervals[index + 1];
            items.splice(index, 1);
            if (previous && following) {
                // Removing the middle activity must not pull the following
                // activity forward. The resulting gap is derived from the two
                // activities that remain on the timeline.
                items[index - 1].transitAfter = Math.max(0, following.start - previous.end);
            } else if (!previous && following) {
                day.startTime = gridTime(following.start);
            } else if (index === items.length && items.length) {
                items[items.length - 1].transitAfter = DEFAULT_LAST_TRANSIT_MINUTES;
            }
            recalculateTimes();
        }

        function updateScheduleStartTime(newTime) {
            if (!isValidClockTime(newTime)) return;
            itineraryData[activeDayIndex].timelineStartTime = newTime;
            renderTimeline();
            autoSaveToLocalStorage();
        }

        function updateScheduleStartTimeFromParts() {
            const hour = document.getElementById('dayStartHourSelect').value;
            const minute = document.getElementById('dayStartMinuteSelect').value;
            updateScheduleStartTime(`${hour}:${minute}`);
            renderDayTabs();
        }

        function switchDay(index) {

            activeDayIndex = index;
            renderDayTabs();
            recalculateTimes();
        }

        function addNewDay() {
            closeEventEditor();
            const nextNum = itineraryData.length + 1;
            itineraryData.push({ dayNumber: nextNum, timelineStartTime: '06:00', startTime: '09:00', items: [] });
            activeDayIndex = itineraryData.length - 1;
            renderDayTabs();

        function removeDay(index) {
            if (itineraryData.length <= 1) return;
            closeEventEditor();
            itineraryData.splice(index, 1);
            itineraryData.forEach((day, i) => day.dayNumber = i + 1);
            activeDayIndex = Math.max(0, index - 1);

        function triggerFileDownload(blob, filename) {
            try {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 1000);
            } catch (e) {
                console.error("Download failed:", e);
            }
        }

        function downloadTextItinerary() {
            let txt = "\uFEFF=== 🇭🇰 香港旅行イティネラリー ===\n\n";

            itineraryData.forEach(day => {
                txt += `------------------------------------\n`;
                txt += `【 Day ${day.dayNumber} 】 (開始時間: ${day.startTime})\n`;
                txt += `------------------------------------\n`;

                if (!day.items || day.items.length === 0) {
                    txt += " (予定なし)\n\n";
                } else {
                    day.items.forEach((item, idx) => {
                        const durationText = item.duration === 'OVERNIGHT' ? '翌朝まで' : formatDurationLabel(item.duration);
                        txt += `${item.startTime} - ${item.endTime} (${durationText})\n`;
                        txt += ` 📍 ${item.name} [${item.category || '予定'}]\n`;
                        if (item.notes) {
                            txt += ` 📝 メモ: ${item.notes}\n`;
                        }
                        if (idx < day.items.length - 1) {
                            const transit = item.transitAfter !== undefined ? item.transitAfter : 30;
                            const transitNote = item.transitNotes ? ` (${item.transitNotes})` : '';
                            txt += `   ↓ [移動 ${transit}分${transitNote}]\n`;
                        }
                        txt += `\n`;
                    });
                }
            });

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            triggerFileDownload(blob, `HongKong_Trip_Plan.txt`);
        }

        function renderPdfOverview() {
            const pdfContainer = document.getElementById('pdfExportTemplate');
            let pdfContent = `
                <div style="font-family: 'Noto Sans JP', sans-serif; background-color: #FAF8F5; color: #2B2621; padding: 20px; max-width: 700px; margin: 0 auto; box-sizing: border-box;">
                <section class="pdf-overview-page" style="padding-top: 6px;">
                    <div style="border-bottom: 2px solid #B8502B; padding-bottom: 10px; margin-bottom: 16px;">
                        <div style="font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #B8502B;">TRIP AT A GLANCE</div>
                        <h2 style="font-size: 19px; color: #2B2621; margin: 4px 0 2px;">全日程タイムライン</h2>
                        <p style="font-size: 10px; color: #7C7369; margin: 0;">時間の流れに沿って、各日の予定を一覧できます。</p>
                    </div>
                    <div class="pdf-overview-grid">
            `;

            itineraryData.forEach(day => {
                pdfContent += `
                    <div class="pdf-overview-day" style="background: #F4EFE6; border: 1px solid #EBE2D3; border-radius: 14px; padding: 12px; box-sizing: border-box;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid #DCD0BB; padding-bottom: 7px; margin-bottom: 10px;">
                            <strong style="font-size: 14px; color: #B8502B;">Day ${day.dayNumber}</strong>
                            <span style="font-size: 9px; color: #7C7369;">${(day.items || []).length} 件の予定</span>
                        </div>
                `;

                if (!day.items || day.items.length === 0) {
                    pdfContent += `<div style="font-size: 10px; color: #7C7369; padding: 10px 2px;">${escapeHtml(day.startTime || '09:00')} 開始 · 予定なし</div>`;
                } else {
                    day.items.forEach((item, idx) => {
                        const durationLabel = item.duration === 'OVERNIGHT' ? '翌朝まで' : formatDurationLabel(item.duration);
                        const transit = idx < day.items.length - 1
                            ? `<div style="font-size: 8px; color: #9B6B33; margin-top: 5px;">移動 ${Number(item.transitAfter ?? 30)}分${item.transitNotes ? ` · ${escapeHtml(item.transitNotes)}` : ''}</div>`
                            : '';
                        pdfContent += `
                            <div class="pdf-overview-event">
                                <div class="pdf-overview-time">
                                    <div style="font-size: 10px; font-weight: 700; color: #B8502B;">${escapeHtml(item.startTime || '')}</div>
                                    <div style="font-size: 8px; color: #7C7369;">${escapeHtml(item.endTime || '')}</div>
                                </div>
                                <div class="pdf-overview-event-card">
                                    <div style="font-size: 10px; font-weight: 700; line-height: 1.45; color: #2B2621;">${escapeHtml(item.name)}</div>
                                    <div style="font-size: 8px; color: #7C7369; margin-top: 3px;">滞在 ${durationLabel}</div>
                                    ${transit}
                                </div>
                            </div>
                        `;
                    });
                }

                pdfContent += `</div>`;
            });

            pdfContent += `
                    </div>
                </section>
                </div>
            `;

            pdfContainer.innerHTML = pdfContent;
            return pdfContainer.firstElementChild;
        }

        function downloadPdfItinerary() {
            const overview = renderPdfOverview();

            if (typeof html2pdf === 'undefined') {
                window.print();
                return;
            }

            const opt = {
                margin: [8, 8, 8, 8],
                filename: 'HongKong_Trip_Timeline.pdf',
                pagebreak: { mode: ['css', 'legacy'], avoid: '.pdf-overview-day' },
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(overview).toPdf().get('pdf').then(function (pdf) {
                const blob = pdf.output('blob');
                triggerFileDownload(blob, 'HongKong_Trip_Timeline.pdf');
            }).catch(function (err) {
                console.warn("PDF generation fallback to standard save:", err);
                html2pdf().set(opt).from(overview).save();
            });
        }

        window.addEventListener('beforeprint', renderPdfOverview);

        window.onload = function() {
            loadFromLocalStorage();
            renderDayTabs();
            renderSpotsList();
            recalculateTimes();
            undoStack = [];
            historyReady = true;
            lastHistoryData = JSON.stringify(itineraryData);
            lastHistoryDayIndex = activeDayIndex;
            updateUndoButton();
        };
    </script>
</body>
</html>
