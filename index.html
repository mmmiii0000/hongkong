<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hong Kong Travel Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cinzel / Plus Jakarta Sans / Noto Sans JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Sortable.js for Drag & Drop Touch Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- html2pdf.js for Reliable PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FAF8F5',  /* Main Soft Background */
                            100: '#F4EFE6', /* Card Surface */
                            200: '#EBE2D3', /* Borders & Divs */
                            300: '#DCD0BB', /* Hover & Active Elements */
                            400: '#C2B093',
                            500: '#A39071',
                            600: '#7F6D50',
                            700: '#5E5039',
                            800: '#3D3323',
                            900: '#221C13',
                        },
                        warm: {
                            accent: '#B8502B', /* Terracotta Accent */
                            accentHover: '#9B4121',
                            gold: '#C5954B',
                            textDark: '#2B2621',
                            textMuted: '#7C7369',
                            cardBg: '#FFFFFF',
                        }
                    },
                    fontFamily: {
                        serifTitle: ['Cinzel', 'serif'],
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #DCD0BB;
            border-radius: 9999px;
        }

        /* Grab Cursor Styles */
        .grab-handle {
            cursor: grab !important;
            cursor: -webkit-grab !important;
            touch-action: none;
        }
        .grab-handle:active, .timeline-item:active {
            cursor: grabbing !important;
            cursor: -webkit-grabbing !important;
        }

        /* Smooth timeline drag: Sortable controls the moving element's transform.
           Never override it with !important or animate it during pointer tracking. */
        .timeline-entry {
            position: relative;
        }

        /* The final activity has no onward journey, but retains its row in the
           DOM so a reorder never needs to destroy and rebuild every card. */
        #timelineContainer > .timeline-entry:last-child > .transit-row {
            display: none;
        }

        .timeline-item {
            transition: box-shadow 150ms ease, border-color 150ms ease, background-color 150ms ease;
        }

        .timeline-entry.sortable-chosen > .timeline-item {
            border-color: #B8502B;
            box-shadow: 0 7px 19px rgba(94, 80, 57, 0.12);
        }

        .timeline-entry.sortable-ghost > .timeline-item {
            opacity: 0.32;
            border: 2px dashed #B8502B;
            background: #F4EFE6;
            box-shadow: none;
        }

        .timeline-entry.sortable-ghost > .transit-row {
            opacity: 0.3;
        }

        /* The fallback clone must follow the pointer at 1:1 speed.
           In particular, do not set transform or transition:transform here. */
        .timeline-entry.sortable-drag {
            z-index: 9999 !important;
            opacity: 0.98;
            pointer-events: none;
            cursor: grabbing !important;
            transition: none !important;
        }

        .timeline-entry.sortable-drag > .timeline-item {
            border-color: #B8502B;
            box-shadow: 0 18px 38px rgba(94, 80, 57, 0.22), 0 5px 12px rgba(184, 80, 43, 0.12);
            transition: none;
        }

        #timelineContainer.is-sorting, #timelineContainer.is-sorting * {
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* The PDF contains only the compact all-day timeline. Keep individual
           day columns together when a longer trip needs another page. */
        .pdf-overview-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            align-items: start;
        }
        .pdf-overview-day {
            min-width: 0;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .pdf-overview-event {
            display: flex;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 9px;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .pdf-overview-event:last-child {
            margin-bottom: 0;
        }
        .pdf-overview-time {
            position: relative;
            box-sizing: border-box;
            flex: 0 0 50px;
            padding: 6px 8px 5px 0;
            border-right: 2px dotted #C5954B;
            font-family: monospace;
            text-align: right;
            line-height: 1.4;
        }
        .pdf-overview-time::after {
            content: '';
            position: absolute;
            top: 10px;
            right: -5px;
            width: 8px;
            height: 8px;
            border: 2px solid #B8502B;
            border-radius: 50%;
            background: #FAF8F5;
            box-sizing: border-box;
        }
        .pdf-overview-event-card {
            box-sizing: border-box;
            flex: 1 1 0;
            min-width: 0;
            border: 1px solid #EBE2D3;
            border-radius: 10px;
            background: #FFFFFF;
            padding: 8px 9px;
            overflow-wrap: anywhere;
        }

        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { display: block !important; background: #FAF8F5 !important; }
            body > header, body > main { display: none !important; }
            #pdfExportTemplate { display: block !important; }
            .pdf-overview-day, .pdf-overview-event { break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-cream-50 text-warm-textDark font-sans min-h-screen flex flex-col antialiased selection:bg-warm-accent selection:text-white">

    <header class="sticky top-0 z-40 bg-cream-50/90 backdrop-blur-md border-b border-cream-200">
        <div class="max-w-5xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-warm-accent text-white flex items-center justify-center font-bold text-base shadow-sm shrink-0">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-warm-textDark tracking-tight flex items-center gap-1.5">
                        <span class="font-serifTitle tracking-wider">HONG KONG</span>
                        <span class="text-[9px] sm:text-[10px] uppercase font-semibold tracking-widest px-1.5 py-0.5 rounded bg-warm-accent/10 text-warm-accent border border-warm-accent/20">Itinerary</span>
                    </h1>
                    <p class="text-[10px] sm:text-[11px] text-warm-textMuted">旅行スケジュール・タイムライン設計</p>
                </div>
            </div>

            <!-- Auto-save Status & Export Buttons -->
            <div class="flex items-center space-x-1.5 sm:space-x-2">
                <div id="saveIndicator" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-[11px] font-medium transition-opacity duration-300 mr-1">
                    <i class="fa-solid fa-floppy-disk text-emerald-600"></i>
                    <span>自動保存済</span>
                </div>

                <button onclick="downloadTextItinerary()" class="px-2.5 py-1.5 sm:px-3.5 sm:py-2 text-xs font-semibold bg-white hover:bg-cream-100 text-warm-textDark border border-cream-300 rounded-xl transition flex items-center gap-1.5 shadow-sm active:scale-95">
                    <i class="fa-solid fa-file-lines text-warm-accent"></i>
                    <span class="hidden sm:inline">テキスト保存</span>
                    <span class="sm:hidden text-[11px]">TXT</span>
                </button>
                <button onclick="downloadPdfItinerary()" title="全日程タイムラインのみPDF保存" class="px-2.5 py-1.5 sm:px-3.5 sm:py-2 text-xs font-semibold bg-warm-accent hover:bg-warm-accentHover text-white border border-warm-accent rounded-xl transition flex items-center gap-1.5 shadow-sm active:scale-95">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span class="hidden sm:inline">PDF保存</span>
                    <span class="sm:hidden text-[11px]">PDF</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 space-y-6 sm:space-y-8">

        <section class="bg-cream-100/70 border border-cream-200 rounded-2xl p-3.5 sm:p-6 shadow-sm">
            
            <!-- Day Tabs -->
            <div class="flex items-center justify-between gap-2 pb-4 border-b border-cream-200 overflow-x-auto no-scrollbar">
                <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1" id="dayTabs">
                    <!-- Day tabs rendered via JS -->
                </div>
                
                <div class="flex items-center gap-1.5 shrink-0 ml-2">
                    <button onclick="addNewDay()" class="px-2.5 py-1.5 text-xs font-semibold bg-white hover:bg-cream-200 text-warm-accent border border-cream-300 hover:border-warm-accent rounded-xl transition flex items-center gap-1 shadow-sm active:scale-95">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span class="whitespace-nowrap">日程追加</span>
                    </button>
                    <button onclick="resetCurrentDay()" title="表示中の日程だけを初期化" class="px-2 py-1.5 text-xs font-medium text-warm-textMuted hover:text-rose-600 bg-white hover:bg-rose-50 border border-cream-300 rounded-xl transition shadow-sm active:scale-95">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span class="hidden sm:inline ml-1">初期化</span>
                    </button>
                </div>
            </div>

            <!-- Active Day Control Bar -->
            <div class="mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-warm-textDark flex items-center gap-2">
                        <i class="fa-regular fa-calendar-check text-warm-accent"></i>
                        <span id="currentDayTitle">Day 1 タイムライン</span>
                    </h2>
                </div>

                <div class="flex items-center gap-2.5 justify-between sm:justify-end w-full sm:w-auto">
                    <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-cream-300 shadow-sm flex-1 sm:flex-none justify-between sm:justify-start">
                        <label for="dayStartTimeSelect" class="text-xs font-medium text-warm-textMuted flex items-center gap-1.5 whitespace-nowrap">
                            <i class="fa-regular fa-clock text-warm-gold"></i>開始時刻:
                        </label>
                        <select id="dayStartTimeSelect" onchange="updateDayStartTime(this.value)"
                            class="bg-transparent text-xs text-warm-textDark font-mono font-bold focus:outline-none cursor-pointer">
                        </select>
                    </div>

                    <button onclick="clearCurrentDay()" title="この日の予定を全削除" class="px-3 py-1.5 text-xs text-warm-textMuted hover:text-rose-600 bg-white hover:bg-rose-50 border border-cream-300 rounded-xl transition flex items-center gap-1 shrink-0 active:scale-95">
                        <i class="fa-solid fa-trash-can"></i>
                        <span class="sm:hidden text-[11px]">クリア</span>
                    </button>
                </div>
            </div>

            <!-- Summary Bar -->
            <div class="mt-3.5 px-3.5 py-2.5 bg-white/80 rounded-xl border border-cream-200 flex flex-wrap items-center justify-between gap-2 text-xs text-warm-textMuted">
                <div class="flex items-center gap-3 sm:gap-4 flex-wrap text-[11px] sm:text-xs">
                    <span><i class="fa-solid fa-location-dot text-warm-accent mr-1"></i>予定: <strong id="summaryCount" class="text-warm-textDark">0</strong> 件</span>
                    <span><i class="fa-solid fa-hourglass-half text-warm-gold mr-1"></i>滞在: <strong id="summaryDuration" class="text-warm-textDark">0分</strong></span>
                    <span><i class="fa-solid fa-person-walking text-warm-accent mr-1"></i>移動: <strong id="summaryTransit" class="text-warm-textDark">0分</strong></span>
                </div>
                <div id="summaryTimeRange" class="font-mono text-warm-accent font-bold text-xs ml-auto">
                    09:00 ~ 09:00
                </div>
            </div>

            <!-- Add Custom Form -->
            <div class="mt-3.5 bg-white border border-cream-200 rounded-xl p-3 shadow-sm">
                <form onsubmit="handleCustomSpotSubmit(event)" class="grid grid-cols-12 gap-2 items-center">
                    <div class="col-span-12 sm:col-span-5">
                        <input type="text" id="customName" placeholder="独自の予定を入力 (例: ホテル, 飲茶)" required
                            class="w-full bg-cream-50 border border-cream-300 rounded-lg px-3 py-1.5 text-xs text-warm-textDark placeholder-cream-400 focus:outline-none focus:border-warm-accent">
                    </div>
                    <div class="col-span-6 sm:col-span-3">
                        <select id="customCategory" class="w-full bg-cream-50 border border-cream-300 rounded-lg px-2 py-1.5 text-xs text-warm-textDark focus:outline-none focus:border-warm-accent">
                            <option value="Landmark">定番名所</option>
                            <option value="Culture">歴史・文化</option>
                            <option value="Food">グルメ・飲茶</option>
                            <option value="Shopping">買物</option>
                            <option value="Nature">絶景・自然</option>
                            <option value="ThemePark">テーマパーク</option>
                            <option value="Art">アート・建築</option>
                            <option value="Hotel">移動・ホテル</option>
                            <option value="Other">その他</option>
                        </select>
                    </div>
                    <div class="col-span-6 sm:col-span-2">
                        <select id="customDuration" required class="w-full bg-cream-50 border border-cream-300 rounded-lg px-1.5 py-1.5 text-xs text-center font-bold text-warm-textDark focus:outline-none focus:border-warm-accent font-mono cursor-pointer">
                            <option value="15">15分</option>
                            <option value="30">30分</option>
                            <option value="45">45分</option>
                            <option value="60" selected>60分</option>
                            <option value="90">90分</option>
                            <option value="120">2時間</option>
                            <option value="180">3時間</option>
                            <option value="240">4時間</option>
                            <option value="300">5時間</option>
                            <option value="360">6時間</option>
                            <option value="420">7時間</option>
                            <option value="480">8時間</option>
                            <option value="OVERNIGHT">🌙 翌朝まで</option>
                        </select>
                    </div>
                    <div class="col-span-12 sm:col-span-2">
                        <button type="submit" class="w-full bg-warm-accent hover:bg-warm-accentHover text-white font-medium py-1.5 rounded-lg text-xs transition shadow-sm flex items-center justify-center gap-1 active:scale-95">
                            <i class="fa-solid fa-plus text-[10px]"></i> 追加
                        </button>
                    </div>
                </form>
            </div>

            <!-- Timeline Container -->
            <div class="mt-4 relative">
                <div id="emptyTimelineState" class="hidden py-8 px-4 flex flex-col items-center justify-center text-center border-2 border-dashed border-cream-300 rounded-2xl bg-white/40">
                    <div class="w-9 h-9 rounded-full bg-cream-200/60 flex items-center justify-center text-cream-600 mb-2">
                        <i class="fa-solid fa-route text-base"></i>
                    </div>
                    <p class="text-xs font-semibold text-warm-textDark">まだ予定が入っていません</p>
                    <p class="text-[10px] sm:text-[11px] text-warm-textMuted mt-0.5">上の入力欄か「香港の有名観光地」から「+ 追加」を押してください</p>
                </div>

                <div id="timelineContainer" class="space-y-2 min-h-[100px]">
                </div>
            </div>
        </section>

        <section class="bg-cream-100/70 border border-cream-200 rounded-2xl p-3.5 sm:p-6 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3.5">
                <div>
                    <h2 class="text-base font-bold text-warm-textDark flex items-center gap-2">
                        <i class="fa-solid fa-star text-warm-gold"></i>
                        香港の有名観光地
                    </h2>
                </div>

                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-warm-textMuted"></i>
                    <input type="text" id="spotSearch" oninput="filterSpots()" placeholder="スポット名で検索..."
                        class="w-full bg-white border border-cream-300 rounded-xl pl-8 pr-3 py-1.5 text-xs text-warm-textDark placeholder-warm-textMuted focus:outline-none focus:border-warm-accent">
                </div>
            </div>

            <!-- Category Filter Pills -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-2 mb-3.5 no-scrollbar" id="categoryContainer">
                <button onclick="setCategory('ALL')" class="cat-btn active border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-warm-accent text-white border-warm-accent shadow-sm">すべて</button>
                <button onclick="setCategory('Landmark')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">定番名所</button>
                <button onclick="setCategory('Culture')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">歴史・文化</button>
                <button onclick="setCategory('Food')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">グルメ・飲茶</button>
                <button onclick="setCategory('Shopping')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">買物</button>
                <button onclick="setCategory('Nature')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">絶景・自然</button>
                <button onclick="setCategory('ThemePark')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">テーマパーク</button>
                <button onclick="setCategory('Art')" class="cat-btn border px-2.5 py-1 rounded-xl text-[11px] font-medium whitespace-nowrap bg-white border-cream-300 text-warm-textMuted">アート・建築</button>
            </div>

            <!-- Attractions Grid -->
            <div id="spotsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            </div>
        </section>

    </main>

    <!-- Hidden Off-screen Container for PDF Export -->
    <div id="pdfExportTemplate" class="hidden"></div>

    <script>
        const STORAGE_KEY = 'hk_travel_planner_state_v1';

        const ATTRACTIONS_DATA = [
            { id: 'hk_01', name: 'ビクトリア・ピーク (太平山)', category: 'Landmark', catName: '定番名所', duration: 120, desc: '100万ドルの夜景を一望できる香港随一の観光名所。ピークトラムで登破。' },
            { id: 'hk_02', name: 'スターフェリー (天星小輪)', category: 'Landmark', catName: '定番名所', duration: 30, desc: 'ビクトリアハーバーを快適に渡る歴史的で風情溢れるフェリー体験。' },
            { id: 'hk_03', name: 'モンスターマンション (益昌大厦)', category: 'Landmark', catName: '定番名所', duration: 45, desc: '映画ロケ地で有名な高密度超高層レジデンス。圧巻のビジュアル。' },
            { id: 'hk_04', name: '大館 (Tai Kwun)', category: 'Art', catName: 'アート・建築', duration: 120, desc: '旧警察署や監獄を洗練されたアート＆文化複合施設へ再生した話題のスポット。' },
            { id: 'hk_05', name: '香港ディズニーランド', category: 'ThemePark', catName: 'テーマパーク', duration: 480, desc: '「ワールド・オブ・フローズン(アナ雪)」エリアが大人気の夢の世界。' },
            { id: 'hk_06', name: '天壇大仏 & 昂坪360', category: 'Culture', catName: '歴史・文化', duration: 180, desc: 'ランタオ島の巨大青銅仏像と、絶景シースルーロープウェイ。' },
            { id: 'hk_07', name: 'アベニュー・オブ・スターズ', category: 'Landmark', catName: '定番名所', duration: 45, desc: 'ブルース・リー像が立つウォーターフロントの美しい遊歩道。' },
            { id: 'hk_08', name: '文武廟 (マンモーテンプル)', category: 'Culture', catName: '歴史・文化', duration: 45, desc: '天井から吊るされた巨大な渦巻き線香が幻想的な香港最古の神社。' },
            { id: 'hk_09', name: '女人街 (レディースマーケット)', category: 'Shopping', catName: '買物', duration: 90, desc: '旺角(モンコック)にある活気溢れる香港名物のナイト露店街。' },

            { id: 'hk_11', name: 'オーシャンパーク (香港海洋公園)', category: 'ThemePark', catName: 'テーマパーク', duration: 360, desc: 'パンダ見学や水族館、絶叫アトラクションが楽しめる巨大パーク。' },
            { id: 'hk_12', name: '彩虹邨 (Choi Hung Estate)', category: 'Art', catName: 'アート・建築', duration: 45, desc: '虹色に彩られたレトロな公営住宅。フォトジェニックな撮影スポット。' },
            { id: 'hk_13', name: '大澳 (タイオー) 漁村', category: 'Culture', catName: '歴史・文化', duration: 180, desc: '「香港のヴェネツィア」と称される水上家屋が残る情緒ある漁村。' },
            { id: 'hk_14', name: '黄大仙祠 (ウォンタイシン)', category: 'Culture', catName: '歴史・文化', duration: 60, desc: '「願い事が叶う」と大人気の道教寺院。おみくじや占いが有名。' },
            { id: 'hk_15', name: 'PMQ (元創方)', category: 'Art', catName: 'アート・建築', duration: 90, desc: '旧警察宿舎を改装したクリエイターや地元ブランドのショップ拠点。' },
            { id: 'hk_16', name: '蘭桂坊 (ランカイフォン)', category: 'Food', catName: 'グルメ・飲茶', duration: 120, desc: '欧米風のバーやレストランがひしめく香港随一のナイトライフ街。' },

            { id: 'hk_19', name: '香港故宮文化博物館', category: 'Art', catName: 'アート・建築', duration: 120, desc: '北京紫禁城の貴重な国宝や文化財が多数展示されている博物館。' },
            { id: 'hk_20', name: 'Sky100 (天際100)', category: 'Landmark', catName: '定番名所', duration: 60, desc: '最高峰ビルICCの100階にある360度パノラマ屋内展望台。' },

            { id: 'hk_22', name: 'ドラゴンズバック (龍脊)', category: 'Nature', catName: '絶景・自然', duration: 210, desc: '海を見渡す尾根を歩くアジア屈指の絶景ハイキングコース。' },

            { id: 'hk_24', name: '萬佛寺 (Ten Thousand Buddhas)', category: 'Culture', catName: '歴史・文化', duration: 90, desc: '参道に金色に輝く等身大の仏像が1万体並ぶ壮観な寺院。' },
            { id: 'hk_25', name: '淺水灣 (リパルスベイ)', category: 'Nature', catName: '絶景・自然', duration: 90, desc: '南部の高級ビーチリゾート。綺麗な砂浜と賑やかな観音像。' },

            { id: 'hk_27', name: '西九龍文化地区 (West Kowloon)', category: 'Nature', catName: '絶景・自然', duration: 90, desc: 'ビクトリアハーバーの夕日と対岸のビル群を望む海辺の芝生公園。' },
            { id: 'hk_28', name: '陸羽茶室 (Lu Yu Tea House)', category: 'Food', catName: 'グルメ・飲茶', duration: 75, desc: '1930年代創業の伝統的香港飲茶名店。レトロでクラシックな空間。' },
            { id: 'hk_29', name: '尖沙咀 (チムサーチョイ) 時計台', category: 'Landmark', catName: '定番名所', duration: 30, desc: '旧九広鉄道の赤レンガ歴史建造物。港のシンボルマーク。' },
            { id: 'hk_30', name: '大浪湾 (Big Wave Bay)', category: 'Nature', catName: '絶景・自然', duration: 180, desc: '自然豊かなサーフィンスポットとしても有名な美しいビーチ。' }
        ];

        function makeMeal(name, startTime, duration, transitAfter = 0) {
            return {
                id: `meal_${name}`, name, duration,
                transitAfter, transitNotes: '', notes: '', category: 'Food',
                startTime,
                endTime: minutesToTime(timeToMinutes(startTime) + duration)
            };
        }

        function makeMealDay(dayNumber) {
            return {
                dayNumber,
                startTime: '09:00',
                items: [
                    makeMeal('朝食', '09:00', 45, 135),
                    makeMeal('ランチ', '12:00', 60, 300),
                    makeMeal('ディナー', '18:00', 60)
                ]
            };
        }

        const DEFAULT_ITINERARY = [
            {
                dayNumber: 1,
                startTime: '08:15',
                items: [
                    makeMeal('朝食', '08:15', 45),
                    { id: 'hk_17', name: 'ヒルサイド・エスカレーター', duration: 45, transitAfter: 30, transitNotes: '徒歩（SOHOエリア）', notes: '中環周辺を散策', category: 'Landmark', startTime: '09:00', endTime: '09:45' },
                    { id: 'hk_08', name: '文武廟 (マンモーテンプル)', duration: 45, transitAfter: 60, transitNotes: 'ランチまでの移動・空き時間', notes: '参拝・写真撮影', category: 'Culture', startTime: '10:15', endTime: '11:00' },
                    makeMeal('ランチ', '12:00', 60),
                    { id: 'hk_01', name: 'ビクトリア・ピーク (太平山)', duration: 120, transitAfter: 180, transitNotes: 'ディナーまでの移動・空き時間', notes: 'ピークトラムに乗車', category: 'Landmark', startTime: '13:00', endTime: '15:00' },
                    makeMeal('ディナー', '18:00', 60, 180),
                    { id: 'hk_hotel_1', name: 'ホテル宿泊 (中環エリア)', duration: 'OVERNIGHT', transitAfter: 0, transitNotes: '', notes: 'ゆっくり就寝', category: 'Hotel', startTime: '22:00', endTime: '翌朝' }
                ]
            },
            {
                dayNumber: 2,
                startTime: '08:45',
                items: [
                    makeMeal('朝食', '08:45', 45),
                    { id: 'hk_05_am', name: '香港ディズニーランド（午前）', duration: 180, transitAfter: 0, transitNotes: '', notes: 'アナ雪エリアを中心に満喫', category: 'ThemePark', startTime: '09:30', endTime: '12:30' },
                    makeMeal('ランチ', '12:30', 60),
                    { id: 'hk_05_pm', name: '香港ディズニーランド（午後）', duration: 300, transitAfter: 30, transitNotes: '夕食場所へ', notes: 'パークを引き続き満喫', category: 'ThemePark', startTime: '13:30', endTime: '18:30' },
                    makeMeal('ディナー', '19:00', 60)
                ]
            }
        ];

        // Earlier versions saved the untouched sample plan on first load. Only
        // upgrade those exact samples; retain every itinerary the user edited.
        const LEGACY_DEFAULT_SIGNATURES = [
            { startTime: '09:00', items: [
                ['hk_17', 'ヒルサイド・エスカレーター', 45, 30, '徒歩（SOHOエリア）', '中環周辺を散策', 'Landmark'],
                ['hk_08', '文武廟 (マンモーテンプル)', 45, 20, 'ピークトラム山頂駅まで移動', '参拝・写真撮影', 'Culture'],
                ['hk_01', 'ビクトリア・ピーク (太平山)', 120, 30, '', 'ピークトラムに乗車', 'Landmark'],
                ['hk_hotel_1', 'ホテル宿泊 (中環エリア)', 'OVERNIGHT', 0, '', 'ゆっくり就寝', 'Hotel']
            ]},
            { startTime: '09:30', items: [
                ['hk_05', '香港ディズニーランド', 480, 30, 'MTRディズニーランドリゾート線', 'アナ雪エリアを中心に満喫', 'ThemePark']
            ]}
        ];

        function isUntouchedLegacyDay(day, index) {
            const original = LEGACY_DEFAULT_SIGNATURES[index];
            return original && day.startTime === original.startTime &&
                Array.isArray(day.items) && day.items.length === original.items.length &&
                day.items.every((item, itemIndex) => {
                    const [id, name, duration, transitAfter, transitNotes, notes, category] = original.items[itemIndex];
                    return item.id === id && item.name === name && item.duration === duration &&
                        item.transitAfter === transitAfter && item.transitNotes === transitNotes &&
                        item.notes === notes && item.category === category;
                });
        }

        function convertSavedTimeAnchors(day) {
            (day.items || []).forEach((item, index) => {
                if (!item.preferredStartTime) return;
                if (index === 0) {
                    if (item.startTime && item.startTime !== '翌朝') day.startTime = item.startTime;
                } else {
                    const previous = day.items[index - 1];
                    if (previous.endTime !== '翌朝' && item.startTime && item.startTime !== '翌朝') {
                        const gap = timeToMinutes(item.startTime) - timeToMinutes(previous.endTime);
                        if (gap >= 0) previous.transitAfter = gap;
                    }
                }
                delete item.preferredStartTime;
            });
        }

        let selectedCategory = 'ALL';
        let activeDayIndex = 0;
        let itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
        let sortableInstance = null;
        let saveBadgeTimer = null;

        function autoSaveToLocalStorage() {
            try {
                const payload = {
                    activeDayIndex: activeDayIndex,
                    itineraryData: itineraryData,
                    lastSavedAt: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                
                const badge = document.getElementById('saveIndicator');
                if (badge) {
                    badge.classList.remove('hidden');
                    clearTimeout(saveBadgeTimer);
                    saveBadgeTimer = setTimeout(() => {
                        badge.classList.add('hidden');
                    }, 1200);
                }
            } catch (err) {
                console.warn('LocalStorage save failed:', err);
            }
        }

        function loadFromLocalStorage() {
            try {
                const savedStr = localStorage.getItem(STORAGE_KEY);
                if (savedStr) {
                    const parsed = JSON.parse(savedStr);
                    if (parsed && Array.isArray(parsed.itineraryData) && parsed.itineraryData.length > 0) {
                        itineraryData = parsed.itineraryData;
                        // Convert only the old 40-minute escalator default; preserve all other saved edits.
                        itineraryData.forEach(day => (day.items || []).forEach(item => {
                            if (/^hk_17(?:_|$)/.test(String(item.id)) && Number(item.duration) === 40) {
                                item.duration = 45;
                            }
                        }));
                        itineraryData = itineraryData.map((day, index) =>
                            isUntouchedLegacyDay(day, index)
                                ? JSON.parse(JSON.stringify(DEFAULT_ITINERARY[index]))
                                : day
                        );
                        itineraryData.forEach(convertSavedTimeAnchors);
                        activeDayIndex = Math.min(parsed.activeDayIndex || 0, itineraryData.length - 1);
                        return true;
                    }
                }
            } catch (err) {
                console.warn('LocalStorage load failed:', err);
            }
            return false;
        }

        function resetCurrentDay() {
            if (!itineraryData[activeDayIndex]) return;
            const initialDay = DEFAULT_ITINERARY[activeDayIndex] || makeMealDay(activeDayIndex + 1);
            itineraryData[activeDayIndex] = JSON.parse(JSON.stringify(initialDay));
            renderDayTabs();
            recalculateTimes();
        }

        function timeToMinutes(timeStr) {
            if (!timeStr || timeStr === '翌朝') return 540;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function minutesToTime(totalMins) {
            const normalizedMins = (totalMins + 1440) % 1440;
            const h = Math.floor(normalizedMins / 60);
            const m = normalizedMins % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function getCategoryStyle(cat) {
            switch(cat) {
                case 'Landmark': return { bg: 'bg-warm-accent/10 border-warm-accent/30 text-warm-accent', icon: 'fa-landmark', label: '定番名所' };
                case 'Culture': return { bg: 'bg-warm-gold/15 border-warm-gold/40 text-warm-700', icon: 'fa-vihara', label: '歴史・文化' };
                case 'Food': return { bg: 'bg-amber-800/10 border-amber-700/30 text-amber-800', icon: 'fa-utensils', label: 'グルメ・飲茶' };
                case 'Shopping': return { bg: 'bg-emerald-800/10 border-emerald-700/30 text-emerald-800', icon: 'fa-bag-shopping', label: '買物' };
                case 'Nature': return { bg: 'bg-teal-800/10 border-teal-700/30 text-teal-800', icon: 'fa-leaf', label: '絶景・自然' };
                case 'ThemePark': return { bg: 'bg-purple-800/10 border-purple-700/30 text-purple-800', icon: 'fa-ticket', label: 'テーマパーク' };
                case 'Art': return { bg: 'bg-indigo-800/10 border-indigo-700/30 text-indigo-800', icon: 'fa-palette', label: 'アート・建築' };
                case 'Hotel': return { bg: 'bg-stone-800/10 border-stone-700/30 text-stone-800', icon: 'fa-hotel', label: '移動・ホテル' };
                default: return { bg: 'bg-cream-200 border-cream-300 text-warm-textMuted', icon: 'fa-location-dot', label: 'その他' };
            }
        }

        function populate15MinTimeOptions() {
            const select = document.getElementById('dayStartTimeSelect');
            select.innerHTML = '';

            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 15) {
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    const opt = document.createElement('option');
                    opt.value = timeStr;
                    opt.innerText = timeStr;
                    select.appendChild(opt);
                }
            }
        }

        function recalculateTimes(renderCards = true) {
            const activeDay = itineraryData[activeDayIndex];
            if (!activeDay || !activeDay.items) return;

            let currentMins = timeToMinutes(activeDay.startTime || '09:00');
            let isOvernightActive = false;

            activeDay.items.forEach((item, idx) => {
                if (isOvernightActive) {
                    item.startTime = '翌朝';
                    item.endTime = '翌朝';
                } else {
                    item.startTime = minutesToTime(currentMins);

                    if (item.duration === 'OVERNIGHT') {
                        item.endTime = '翌朝';
                        isOvernightActive = true;
                    } else {
                        const stayMins = parseInt(item.duration, 10) || 30;
                        currentMins += stayMins;
                        item.endTime = minutesToTime(currentMins);
                    }
                }

                if (item.transitAfter === undefined) item.transitAfter = 30;
                if (item.transitNotes === undefined) item.transitNotes = '';

                if (!isOvernightActive && idx < activeDay.items.length - 1) {
                    const transitMins = parseInt(item.transitAfter, 10) || 0;
                    currentMins += transitMins;
                }
            });

            if (renderCards) {
                renderTimeline();
            } else {
                syncTimelineAfterSort();
            }
            updateSummaryBar();
            autoSaveToLocalStorage();
        }

        function renderDayTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            tabsContainer.innerHTML = itineraryData.map((day, idx) => {
                const isActive = idx === activeDayIndex;
                return `
                    <button onclick="switchDay(${idx})" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 whitespace-nowrap active:scale-95 ${
                        isActive 
                        ? 'bg-warm-accent text-white shadow-sm' 
                        : 'bg-white hover:bg-cream-200 text-warm-textMuted border border-cream-300'
                    }">
                        <span>Day ${day.dayNumber}</span>
                        ${itineraryData.length > 1 ? `<i onclick="event.stopPropagation(); removeDay(${idx})" class="fa-solid fa-xmark text-[10px] opacity-70 hover:opacity-100 ml-0.5"></i>` : ''}
                    </button>
                `;
            }).join('');

            document.getElementById('currentDayTitle').innerText = `Day ${itineraryData[activeDayIndex].dayNumber} タイムライン`;
            const startSelect = document.getElementById('dayStartTimeSelect');
            const startTime = itineraryData[activeDayIndex].startTime || '09:00';
            if (!Array.from(startSelect.options).some(option => option.value === startTime)) {
                const option = document.createElement('option');
                option.value = startTime;
                option.textContent = startTime;
                startSelect.appendChild(option);
            }
            startSelect.value = startTime;
        }

        // Short stays: 15-minute increments through 60 minutes, then 90 minutes;
        // from 120 minutes onward, offer whole hours through 8 hours.
        const STANDARD_DURATIONS = [15, 30, 45, 60, 90, 120, 180, 240, 300, 360, 420, 480];

        function formatDurationLabel(duration) {
            const minutes = Number(duration);
            if (!Number.isFinite(minutes) || minutes < 120) return `${duration}分`;
            const hours = Math.floor(minutes / 60);
            const remainder = minutes % 60;
            return `${hours}時間${remainder ? `${remainder}分` : ''}`;
        }

        // Preserve previously saved nonstandard durations without silently
        // changing the selection or modifying a user's existing itinerary.
        function renderDurationOptions(duration) {
            const durations = [...STANDARD_DURATIONS];
            const current = Number(duration);
            if (duration !== 'OVERNIGHT' && Number.isFinite(current) && current > 0 && !durations.includes(current)) {
                durations.push(current);
                durations.sort((a, b) => a - b);
            }
            return durations.map(minutes =>
                `<option value="${minutes}" ${duration !== 'OVERNIGHT' && current === minutes ? 'selected' : ''}>${formatDurationLabel(minutes)}</option>`
            ).join('') + `<option value="OVERNIGHT" ${duration === 'OVERNIGHT' ? 'selected' : ''}>🌙 翌朝まで</option>`;
        }

        function renderTimeline() {
            const activeDay = itineraryData[activeDayIndex];
            const container = document.getElementById('timelineContainer');
            const emptyState = document.getElementById('emptyTimelineState');

            if (!activeDay || activeDay.items.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                updateSummaryBar();
                return;
            }

            emptyState.classList.add('hidden');

            let htmlContent = '';

            activeDay.items.forEach((item, index) => {
                const isOvernight = item.duration === 'OVERNIGHT';

                htmlContent += `

                    <div class="timeline-item bg-white rounded-xl p-3 sm:p-3.5 border border-cream-200 hover:border-warm-accent/50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5 shadow-sm">
                        
                        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                            <div class="flex items-center gap-2">
                                <div class="grab-handle text-cream-400 group-hover:text-warm-accent transition p-1.5 rounded flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-grip-vertical text-sm"></i>
                                </div>

                                <div class="flex items-center gap-1 font-mono text-xs font-bold text-warm-accent bg-cream-50 px-2 py-1 rounded-lg border border-cream-200">
                                    ${item.startTime === '翌朝'
                                        ? `<span class="timeline-time-start">翌朝</span>`
                                        : `<input type="time" value="${escapeHtml(item.startTime)}" aria-label="開始時刻" title="開始時刻を変更" onchange="updateItemStartTime(${index}, this)" onclick="event.stopPropagation()" class="timeline-time-start w-[82px] sm:w-[95px] min-w-0 bg-transparent font-mono text-xs font-bold text-warm-accent focus:outline-none focus:ring-1 focus:ring-warm-accent rounded">`}
                                    <span class="text-cream-400">-</span>
                                    ${isOvernight || item.endTime === '翌朝'
                                        ? `<span class="timeline-time-end">翌朝</span>`
                                        : `<input type="time" value="${escapeHtml(item.endTime)}" aria-label="終了時刻" title="終了時刻を変更" onchange="updateItemEndTime(${index}, this)" onclick="event.stopPropagation()" class="timeline-time-end w-[82px] sm:w-[95px] min-w-0 bg-transparent font-mono text-xs font-bold text-warm-accent focus:outline-none focus:ring-1 focus:ring-warm-accent rounded">`}
                                </div>
                            </div>

                            <div class="flex items-center gap-1">
                                <select onchange="updateItemDuration(${index}, this.value)"
                                    onclick="event.stopPropagation()"
                                    class="bg-white border border-cream-300 rounded text-center text-warm-textDark px-1.5 py-0.5 text-xs font-mono font-bold focus:outline-none focus:border-warm-accent cursor-pointer">
                                    ${renderDurationOptions(item.duration)}
                                </select>

                                <button onclick="removeTimelineItem(${index})" title="削除"
                                    class="sm:hidden w-7 h-7 rounded-lg hover:bg-rose-50 text-cream-400 hover:text-rose-600 flex items-center justify-center transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex-1 min-w-0 w-full space-y-1">
                            <div class="flex items-center gap-1.5">
                                <input type="text" value="${escapeHtml(item.name)}" 
                                    onchange="updateItemName(${index}, this.value)"
                                    onclick="event.stopPropagation()"
                                    placeholder="予定名を入力..."
                                    class="font-bold text-xs sm:text-sm text-warm-textDark bg-transparent hover:bg-cream-50 focus:bg-white border-b border-transparent hover:border-cream-300 focus:border-warm-accent px-1 py-0.5 rounded transition focus:outline-none flex-1 min-w-[120px]">
                                
                                <select onchange="updateItemCategory(${index}, this.value)"
                                    onclick="event.stopPropagation()"
                                    class="text-[10px] font-medium border px-1.5 py-0.5 rounded bg-white border-cream-300 text-warm-textDark focus:outline-none cursor-pointer">
                                    <option value="Landmark" ${item.category === 'Landmark' ? 'selected' : ''}>定番名所</option>
                                    <option value="Culture" ${item.category === 'Culture' ? 'selected' : ''}>歴史・文化</option>
                                    <option value="Food" ${item.category === 'Food' ? 'selected' : ''}>グルメ・飲茶</option>
                                    <option value="Shopping" ${item.category === 'Shopping' ? 'selected' : ''}>買物</option>
                                    <option value="Nature" ${item.category === 'Nature' ? 'selected' : ''}>絶景・自然</option>
                                    <option value="ThemePark" ${item.category === 'ThemePark' ? 'selected' : ''}>テーマパーク</option>
                                    <option value="Art" ${item.category === 'Art' ? 'selected' : ''}>アート・建築</option>
                                    <option value="Hotel" ${item.category === 'Hotel' ? 'selected' : ''}>移動・ホテル</option>
                                    <option value="Other" ${item.category === 'Other' ? 'selected' : ''}>その他</option>
                                </select>
                            </div>

                            <input type="text" value="${escapeHtml(item.notes || '')}" placeholder="メモ・予約情報など..." 
                                onchange="updateItemNotes(${index}, this.value)"
                                onclick="event.stopPropagation()"
                                class="w-full bg-transparent text-[11px] sm:text-xs text-warm-textMuted placeholder-cream-400 focus:text-warm-textDark border-b border-dashed border-cream-200 focus:border-warm-accent px-1 py-0.5 transition focus:outline-none">
                        </div>

                        <div class="hidden sm:flex items-center gap-1 shrink-0">
                            <button onclick="removeTimelineItem(${index})" title="削除"
                                class="w-7 h-7 rounded-lg hover:bg-rose-50 text-cream-400 hover:text-rose-600 flex items-center justify-center transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;

                // Keep a transit row in every wrapper; CSS hides the last one.
                // This avoids recreating the DOM when the last activity is moved.
                {
                    const transitVal = item.transitAfter !== undefined ? item.transitAfter : 30;
                    const transitNoteVal = item.transitNotes || '';
                    htmlContent += `
                        <div class="transit-row flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-1.5 mt-2 py-1 px-3 bg-cream-100/60 border border-dashed border-cream-300 rounded-xl text-xs text-warm-textMuted select-none">
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-warm-gold font-medium text-[11px] flex items-center gap-1">
                                    <i class="fa-solid fa-person-walking text-xs"></i> 移動:
                                </span>
                                <div class="flex items-center gap-1 bg-white px-1.5 py-0.5 rounded border border-cream-300">
                                    <input type="number" min="0" max="1439" step="1" value="${transitVal}" 
                                        onchange="updateTransitTime(${index}, this.value)"
                                        onclick="event.stopPropagation()"
                                        class="w-9 bg-transparent text-center font-mono font-bold text-xs text-warm-textDark focus:outline-none">
                                    <span class="text-[10px] text-warm-textMuted">分</span>
                                </div>
                            </div>

                            <div class="flex-1 min-w-0 flex items-center gap-1">
                                <input type="text" value="${escapeHtml(transitNoteVal)}" 
                                    placeholder="移動メモ (例: MTR, 徒歩5分)" 
                                    onchange="updateTransitNotes(${index}, this.value)"
                                    onclick="event.stopPropagation()"
                                    class="w-full bg-white/80 hover:bg-white focus:bg-white border border-transparent hover:border-cream-300 focus:border-warm-accent rounded px-2 py-0.5 text-[11px] text-warm-textDark placeholder-cream-400 transition focus:outline-none">
                            </div>
                        </div>
                    `;
                }
                // Move the activity and its following transit information together.
                htmlContent += `</div>`;
            });

            container.innerHTML = htmlContent;

            initSortable();
            updateSummaryBar();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;")
                              .replace(/</g, "&lt;")
                              .replace(/>/g, "&gt;")
                              .replace(/"/g, "&quot;")
                              .replace(/'/g, "&#039;");
        }

        // Preserve the actual DOM on drop; replacing innerHTML here would cause
        // a visible snap and discard Sortable's final movement animation.
        function syncTimelineAfterSort() {
            const container = document.getElementById('timelineContainer');
            const items = itineraryData[activeDayIndex].items;
            let needsRebuild = false;
            Array.from(container.children).forEach((entry, index) => {
                if (!entry.classList.contains('timeline-entry')) return;
                entry.dataset.index = String(index);
                for (const [selector, value] of [
                    ['.timeline-time-start', items[index].startTime],
                    ['.timeline-time-end', items[index].endTime]
                ]) {
                    const control = entry.querySelector(selector);
                    if (!control || (control.tagName === 'INPUT') === (value === '翌朝')) {
                        needsRebuild = true;
                    } else if (control.tagName === 'INPUT') {
                        control.value = value;
                    } else {
                        control.textContent = value;
                    }
                }

                // Inline edit/remove actions must reference the NEW list indices.
                entry.querySelectorAll('[onchange], [onclick]').forEach(control => {
                    ['onchange', 'onclick'].forEach(attribute => {
                        const handler = control.getAttribute(attribute);
                        if (!handler) return;
                        control.setAttribute(attribute, handler.replace(
                            /(updateItemDuration|updateItemStartTime|updateItemEndTime|removeTimelineItem|updateItemName|updateItemCategory|updateItemNotes|updateTransitTime|updateTransitNotes)\(\d+/g,
                            (_, action) => `${action}(${index}`
                        ));
                    });
                });
            });
            if (needsRebuild) renderTimeline();
        }

        function initSortable() {
            const container = document.getElementById('timelineContainer');
            if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }

            sortableInstance = new Sortable(container, {
                animation: 180,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                draggable: '.timeline-entry',
                handle: '.grab-handle',
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                forceFallback: true,
                fallbackClass: 'sortable-drag',
                fallbackOnBody: true,
                fallbackTolerance: 2,
                touchStartThreshold: 3,
                swapThreshold: 0.55,
                scroll: true,
                scrollSensitivity: 60,
                scrollSpeed: 12,
                onStart: function () {
                    container.classList.add('is-sorting');
                },
                onUnchoose: function () {
                    container.classList.remove('is-sorting');
                },
                onEnd: function (evt) {
                    container.classList.remove('is-sorting');
                    if (evt.oldIndex === evt.newIndex) return;

                    const activeDay = itineraryData[activeDayIndex];
                    // Only direct sortable children count: transit rows belong to their item.
                    const entries = Array.from(container.children).filter(el => el.classList.contains('timeline-entry'));
                    const orderedItems = entries.map(el => {
                        const index = Number(el.dataset.index);
                        return activeDay.items[index];
                    });
                    if (orderedItems.length !== activeDay.items.length || orderedItems.some(item => !item)) {
                        renderTimeline();
                        return;
                    }
                    activeDay.items = orderedItems;
                    recalculateTimes(false);
                }
            });
        }

        function updateSummaryBar() {
            const activeDay = itineraryData[activeDayIndex];
            if (!activeDay || activeDay.items.length === 0) {
                document.getElementById('summaryCount').innerText = '0';
                document.getElementById('summaryDuration').innerText = '0分';
                document.getElementById('summaryTransit').innerText = '0分';
                document.getElementById('summaryTimeRange').innerText = '09:00 ~ 09:00';
                return;
            }

            let hasOvernight = false;
            const totalStayMins = activeDay.items.reduce((acc, item) => {
                if (item.duration === 'OVERNIGHT') {
                    hasOvernight = true;
                    return acc;
                }
                return acc + (parseInt(item.duration, 10) || 0);
            }, 0);
            
            let totalTransitMins = 0;
            for (let i = 0; i < activeDay.items.length - 1; i++) {
                totalTransitMins += parseInt(activeDay.items[i].transitAfter !== undefined ? activeDay.items[i].transitAfter : 30, 10);
            }

            const formatDuration = (totalMins, overnight) => {
                const h = Math.floor(totalMins / 60);
                const m = totalMins % 60;
                let text = h > 0 ? `${h}h ${m}m` : `${m}m`;
                if (overnight) text += ' (+宿泊)';
                return text;
            };

            const start = activeDay.items[0].startTime;
            const end = activeDay.items[activeDay.items.length - 1].endTime;

            document.getElementById('summaryCount').innerText = activeDay.items.length;
            document.getElementById('summaryDuration').innerText = formatDuration(totalStayMins, hasOvernight);
            document.getElementById('summaryTransit').innerText = `${totalTransitMins}分`;
            document.getElementById('summaryTimeRange').innerText = `${start} ~ ${end}`;
        }

        function renderSpotsList() {
            const grid = document.getElementById('spotsGrid');
            const searchVal = document.getElementById('spotSearch').value.toLowerCase();

            const filtered = ATTRACTIONS_DATA.filter(spot => {
                const matchesCategory = (selectedCategory === 'ALL') || (spot.category === selectedCategory);
                const matchesSearch = spot.name.toLowerCase().includes(searchVal) || spot.desc.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-6 text-center text-warm-textMuted text-xs">
                        該当する観光地が見つかりませんでした
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(spot => {
                const style = getCategoryStyle(spot.category);
                return `
                    <div class="bg-white rounded-xl p-3 border border-cream-200 flex flex-col justify-between gap-2 shadow-sm transition">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-medium border ${style.bg}">
                                    <i class="fa-solid ${style.icon} mr-1"></i>${spot.catName}
                                </span>
                                <span class="text-[10px] text-warm-textMuted">
                                    <i class="fa-regular fa-clock mr-0.5"></i>約${formatDurationLabel(spot.duration)}
                                </span>
                            </div>
                            <h3 class="text-xs font-bold text-warm-textDark">${spot.name}</h3>
                            <p class="text-[10px] sm:text-[11px] text-warm-textMuted line-clamp-2 mt-0.5 leading-relaxed">${spot.desc}</p>
                        </div>
                        <button onclick="addSpotToCurrentDay('${spot.id}')"
                            class="mt-1 w-full bg-cream-50 hover:bg-warm-accent text-warm-textDark hover:text-white border border-cream-300 hover:border-warm-accent py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1 shadow-sm active:scale-95">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                            <span>行程に追加</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-warm-accent', 'text-white', 'border-warm-accent', 'shadow-sm');
                btn.classList.add('bg-white', 'border-cream-300', 'text-warm-textMuted');
            });

            event.currentTarget.classList.remove('bg-white', 'border-cream-300', 'text-warm-textMuted');
            event.currentTarget.classList.add('bg-warm-accent', 'text-white', 'border-warm-accent', 'shadow-sm');

            renderSpotsList();
        }

        function filterSpots() {
            renderSpotsList();
        }

        function addItemToActiveDay(newItem) {
            const activeDay = itineraryData[activeDayIndex];
            if (!activeDay) return;

            // Fill the next available part of the day before a meal. New days
            // already contain dinner, so simply appending would put every new
            // sightseeing item after dinner.
            if (newItem.duration !== 'OVERNIGHT') {
                for (const mealName of ['ランチ', 'ディナー']) {
                    const mealIndex = activeDay.items.findIndex(item => item.id === `meal_${mealName}`);
                    if (mealIndex < 0) continue;
                    const previous = activeDay.items[mealIndex - 1];
                    if (previous && previous.duration === 'OVERNIGHT') continue;
                    const previousEnd = previous ? timeToMinutes(previous.endTime) : timeToMinutes(activeDay.startTime);
                    const space = timeToMinutes(activeDay.items[mealIndex].startTime) - previousEnd;
                    const moveBefore = previous ? Math.min(Number(previous.transitAfter) || 0, 30) : 0;
                    const moveAfter = space - moveBefore - Number(newItem.duration);
                    if (moveAfter >= 0) {
                        if (previous) previous.transitAfter = moveBefore;
                        newItem.transitAfter = moveAfter;
                        activeDay.items.splice(mealIndex, 0, newItem);
                        recalculateTimes();
                        return;
                    }
                }
            }

            const dinnerIndex = activeDay.items.findIndex(item => item.id === 'meal_ディナー');
            const overnightIndex = activeDay.items.findIndex(item => item.duration === 'OVERNIGHT');
            const insertIndex = [dinnerIndex, overnightIndex].filter(index => index >= 0);
            if (insertIndex.length) activeDay.items.splice(Math.min(...insertIndex), 0, newItem);
            else activeDay.items.push(newItem);

            recalculateTimes();
        }

        function addSpotToCurrentDay(spotId) {
            const spot = ATTRACTIONS_DATA.find(s => s.id === spotId);
            if (!spot) return;

            const newItem = {
                id: spot.id + '_' + Date.now(),
                name: spot.name,
                duration: spot.duration,
                transitAfter: 30,
                transitNotes: '',
                notes: spot.desc,
                category: spot.category,
                startTime: '',
                endTime: ''
            };

            addItemToActiveDay(newItem);
        }

        function handleCustomSpotSubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById('customName');
            const durationSelect = document.getElementById('customDuration');
            const catInput = document.getElementById('customCategory');

            const selectedVal = durationSelect.value;
            const durationVal = selectedVal === 'OVERNIGHT' ? 'OVERNIGHT' : (parseInt(selectedVal, 10) || 60);

            const newItem = {
                id: 'custom_' + Date.now(),
                name: nameInput.value.trim(),
                duration: durationVal,
                transitAfter: 30,
                transitNotes: '',
                notes: '',
                category: catInput.value,
                startTime: '',
                endTime: ''
            };

            nameInput.value = '';
            addItemToActiveDay(newItem);
        }

        function updateItemName(index, val) {
            itineraryData[activeDayIndex].items[index].name = val.trim();
            autoSaveToLocalStorage();
        }

        function updateItemCategory(index, val) {
            itineraryData[activeDayIndex].items[index].category = val;
            renderTimeline();
            autoSaveToLocalStorage();
        }

        function updateItemDuration(index, val) {
            if (val === 'OVERNIGHT') {
                itineraryData[activeDayIndex].items[index].duration = 'OVERNIGHT';
            } else {
                const parsed = parseInt(val, 10);
                if (isNaN(parsed) || parsed < 1) return;
                itineraryData[activeDayIndex].items[index].duration = parsed;
            }
            recalculateTimes();
        }

        function isValidClockTime(value) {
            return /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
        }

        function rejectTimeEdit(input, previousValue, message) {
            input.value = previousValue;
            window.alert(message);
        }

        function updateItemStartTime(index, input) {
            const day = itineraryData[activeDayIndex];
            const item = day.items[index];
            const newTime = input.value;
            if (!isValidClockTime(newTime)) {
                rejectTimeEdit(input, item.startTime, '開始時刻を時:分の形式で入力してください。');
                return;
            }

            if (index === 0) {
                day.startTime = newTime;
                recalculateTimes();
                renderDayTabs();
                return;
            }

            const previous = day.items[index - 1];
            if (previous.endTime === '翌朝' || timeToMinutes(newTime) < timeToMinutes(previous.endTime)) {
                rejectTimeEdit(input, item.startTime,
                    `前の予定の終了時刻（${previous.endTime}）より早い開始時刻にはできません。`);
                return;
            }

            previous.transitAfter = timeToMinutes(newTime) - timeToMinutes(previous.endTime);
            recalculateTimes();
        }

        function updateItemEndTime(index, input) {
            const item = itineraryData[activeDayIndex].items[index];
            const newTime = input.value;
            if (!isValidClockTime(newTime) || timeToMinutes(newTime) <= timeToMinutes(item.startTime)) {
                rejectTimeEdit(input, item.endTime, '終了時刻は開始時刻より後にしてください。');
                return;
            }

            item.duration = timeToMinutes(newTime) - timeToMinutes(item.startTime);
            recalculateTimes();
        }

        function updateTransitTime(index, val) {
            const parsed = parseInt(val, 10);
            if (isNaN(parsed) || parsed < 0) return;
            itineraryData[activeDayIndex].items[index].transitAfter = parsed;
            recalculateTimes();
        }

        function updateTransitNotes(index, val) {
            itineraryData[activeDayIndex].items[index].transitNotes = val;
            autoSaveToLocalStorage();
        }

        function updateItemNotes(index, text) {
            itineraryData[activeDayIndex].items[index].notes = text;
            autoSaveToLocalStorage();
        }

        function removeTimelineItem(index) {
            itineraryData[activeDayIndex].items.splice(index, 1);
            recalculateTimes();
        }

        function updateDayStartTime(newTime) {
            if (!newTime) return;
            itineraryData[activeDayIndex].startTime = newTime;
            recalculateTimes();
        }

        function switchDay(index) {
            activeDayIndex = index;
            renderDayTabs();
            renderTimeline();
            autoSaveToLocalStorage();
        }

        function addNewDay() {
            const nextNum = itineraryData.length + 1;
            itineraryData.push(makeMealDay(nextNum));
            activeDayIndex = itineraryData.length - 1;
            renderDayTabs();
            recalculateTimes();
        }

        function removeDay(index) {
            if (itineraryData.length <= 1) return;
            itineraryData.splice(index, 1);
            itineraryData.forEach((day, i) => day.dayNumber = i + 1);
            activeDayIndex = Math.max(0, index - 1);
            renderDayTabs();
            renderTimeline();
            autoSaveToLocalStorage();
        }

        function clearCurrentDay() {
            const activeDay = itineraryData[activeDayIndex];
            if (!activeDay) return;
            activeDay.items = [];
            recalculateTimes();
        }

        function triggerFileDownload(blob, filename) {
            try {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 1000);
            } catch (e) {
                console.error("Download failed:", e);
            }
        }

        function downloadTextItinerary() {
            let txt = "\uFEFF=== 🇭🇰 香港旅行イティネラリー ===\n\n";

            itineraryData.forEach(day => {
                txt += `------------------------------------\n`;
                txt += `【 Day ${day.dayNumber} 】 (開始時間: ${day.startTime})\n`;
                txt += `------------------------------------\n`;

                if (!day.items || day.items.length === 0) {
                    txt += " (予定なし)\n\n";
                } else {
                    day.items.forEach((item, idx) => {
                        const durationText = item.duration === 'OVERNIGHT' ? '翌朝まで' : formatDurationLabel(item.duration);
                        txt += `${item.startTime} - ${item.endTime} (${durationText})\n`;
                        txt += ` 📍 ${item.name} [${item.category || '予定'}]\n`;
                        if (item.notes) {
                            txt += ` 📝 メモ: ${item.notes}\n`;
                        }
                        if (idx < day.items.length - 1) {
                            const transit = item.transitAfter !== undefined ? item.transitAfter : 30;
                            const transitNote = item.transitNotes ? ` (${item.transitNotes})` : '';
                            txt += `   ↓ [移動 ${transit}分${transitNote}]\n`;
                        }
                        txt += `\n`;
                    });
                }
            });

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            triggerFileDownload(blob, `HongKong_Trip_Plan.txt`);
        }

        function renderPdfOverview() {
            const pdfContainer = document.getElementById('pdfExportTemplate');
            let pdfContent = `
                <div style="font-family: 'Noto Sans JP', sans-serif; background-color: #FAF8F5; color: #2B2621; padding: 20px; max-width: 700px; margin: 0 auto; box-sizing: border-box;">
                <section class="pdf-overview-page" style="padding-top: 6px;">
                    <div style="border-bottom: 2px solid #B8502B; padding-bottom: 10px; margin-bottom: 16px;">
                        <div style="font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #B8502B;">TRIP AT A GLANCE</div>
                        <h2 style="font-size: 19px; color: #2B2621; margin: 4px 0 2px;">全日程タイムライン</h2>
                        <p style="font-size: 10px; color: #7C7369; margin: 0;">時間の流れに沿って、各日の予定を一覧できます。</p>
                    </div>
                    <div class="pdf-overview-grid">
            `;

            itineraryData.forEach(day => {
                pdfContent += `
                    <div class="pdf-overview-day" style="background: #F4EFE6; border: 1px solid #EBE2D3; border-radius: 14px; padding: 12px; box-sizing: border-box;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid #DCD0BB; padding-bottom: 7px; margin-bottom: 10px;">
                            <strong style="font-size: 14px; color: #B8502B;">Day ${day.dayNumber}</strong>
                            <span style="font-size: 9px; color: #7C7369;">${(day.items || []).length} 件の予定</span>
                        </div>
                `;

                if (!day.items || day.items.length === 0) {
                    pdfContent += `<div style="font-size: 10px; color: #7C7369; padding: 10px 2px;">${escapeHtml(day.startTime || '09:00')} 開始 · 予定なし</div>`;
                } else {
                    day.items.forEach((item, idx) => {
                        const durationLabel = item.duration === 'OVERNIGHT' ? '翌朝まで' : formatDurationLabel(item.duration);
                        const transit = idx < day.items.length - 1
                            ? `<div style="font-size: 8px; color: #9B6B33; margin-top: 5px;">移動 ${Number(item.transitAfter ?? 30)}分${item.transitNotes ? ` · ${escapeHtml(item.transitNotes)}` : ''}</div>`
                            : '';
                        pdfContent += `
                            <div class="pdf-overview-event">
                                <div class="pdf-overview-time">
                                    <div style="font-size: 10px; font-weight: 700; color: #B8502B;">${escapeHtml(item.startTime || '')}</div>
                                    <div style="font-size: 8px; color: #7C7369;">${escapeHtml(item.endTime || '')}</div>
                                </div>
                                <div class="pdf-overview-event-card">
                                    <div style="font-size: 10px; font-weight: 700; line-height: 1.45; color: #2B2621;">${escapeHtml(item.name)}</div>
                                    <div style="font-size: 8px; color: #7C7369; margin-top: 3px;">滞在 ${durationLabel}</div>
                                    ${transit}
                                </div>
                            </div>
                        `;
                    });
                }

                pdfContent += `</div>`;
            });

            pdfContent += `
                    </div>
                </section>
                </div>
            `;

            pdfContainer.innerHTML = pdfContent;
            return pdfContainer.firstElementChild;
        }

        function downloadPdfItinerary() {
            const overview = renderPdfOverview();

            if (typeof html2pdf === 'undefined') {
                window.print();
                return;
            }

            const opt = {
                margin: [8, 8, 8, 8],
                filename: 'HongKong_Trip_Timeline.pdf',
                pagebreak: { mode: ['css', 'legacy'], avoid: '.pdf-overview-day' },
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(overview).toPdf().get('pdf').then(function (pdf) {
                const blob = pdf.output('blob');
                triggerFileDownload(blob, 'HongKong_Trip_Timeline.pdf');
            }).catch(function (err) {
                console.warn("PDF generation fallback to standard save:", err);
                html2pdf().set(opt).from(overview).save();
            });
        }

        window.addEventListener('beforeprint', renderPdfOverview);

        window.onload = function() {
            populate15MinTimeOptions();
            loadFromLocalStorage();
            renderDayTabs();
            renderSpotsList();
            recalculateTimes();
        };
    </script>
